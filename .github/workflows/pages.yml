# Publica el cuento en GitHub Pages en cada push a main.
# El proyecto vive en la subcarpeta DIse-o-Intaractivo-main/: se sube esa carpeta
# (su index.html redirige a dist/, y el visor está en dist/vr/).
# GitHub solo lee flujos en .github/workflows/ de la RAÍZ del repositorio; el que
# está dentro de DIse-o-Intaractivo-main/.github/ no se ejecuta aquí.
name: Publicar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'DIse-o-Intaractivo-main'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
